<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2F4F1" />
    <!-- Apply the saved appearance before first paint, so dark mode never
         flashes light. Mirrors theme.js. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("budge.theme"); } catch (e) {}
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0A0E0C" : "#F2F4F1");
      })();
    </script>
    <!-- The first thing the app does after booting is call Supabase. Warming DNS
         + TLS here takes that handshake off the critical path on mobile. -->
    <link rel="preconnect" href="https://uwmgisvhhzcbcisdlafp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://uwmgisvhhzcbcisdlafp.supabase.co" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="budge" />
    <meta name="description" content="budge — make it to Friday. A free weekly allowance tracker for students that opens straight to the log screen." />
    <title>budge·</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
