<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F9F9F9" />
    <!-- Apply the saved appearance before first paint, so dark mode never
         flashes light. Mirrors theme.js. -->
    <script>
      (function () {
        var t = null, p = null;
        try { t = localStorage.getItem("budge.theme"); p = localStorage.getItem("budge.palette"); } catch (e) {}
        if (p && /^[a-z]+$/.test(p)) document.documentElement.setAttribute("data-palette", p);
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#111111" : "#F9F9F9"); // refined by theme.js once styles load
      })();
    </script>
    <!-- The first thing the app does after booting is call Supabase. Warming DNS
         + TLS here takes that handshake off the critical path on mobile. -->
    <link rel="preconnect" href="https://uwmgisvhhzcbcisdlafp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://uwmgisvhhzcbcisdlafp.supabase.co" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="budge" />
    <meta name="description" content="budge — make it to Friday. A free weekly allowance tracker for students that opens straight to the log screen." />
    <title>budge·</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
